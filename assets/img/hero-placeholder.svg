<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Segnaposto foto hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#1E2A1C"/>
      <stop offset="45%"  stop-color="#141A13"/>
      <stop offset="100%" stop-color="#0B0C0B"/>
    </linearGradient>

    <radialGradient id="light" cx="50%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#C8FF2E" stop-opacity="0.10"/>
      <stop offset="60%"  stop-color="#C8FF2E" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8FF2E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0B0C0B" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#0B0C0B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0B0C0B" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#light)"/>

  <!-- Suggestione di alberi sullo sfondo, molto sfocata -->
  <g filter="url(#soft)" opacity="0.5">
    <rect x="80"   y="-100" width="70"  height="1300" fill="#0A120A"/>
    <rect x="270"  y="-160" width="46"  height="1200" fill="#0D160C"/>
    <rect x="430"  y="-80"  width="90"  height="1150" fill="#091009"/>
    <rect x="700"  y="-140" width="56"  height="1250" fill="#0D160C"/>
    <rect x="880"  y="-60"  width="78"  height="1180" fill="#0A120A"/>
    <rect x="1070" y="-120" width="52"  height="1220" fill="#0D160C"/>
  </g>

  <!-- Silhouette appena accennata del soggetto -->
  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="600" cy="620" rx="112" ry="132" fill="#242E22"/>
    <path d="M600 760c-150 0-250 110-272 260-16 108-24 220-24 340h592c0-120-8-232-24-340-22-150-122-260-272-260Z" fill="#202A1E"/>
  </g>

  <!-- Vignettatura e scurimento verso il basso -->
  <rect width="1200" height="1600" fill="url(#fade)"/>

  <!-- Grana pellicola -->
  <rect width="1200" height="1600" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:overlay"/>

  <!-- Nota tecnica: sparisce appena viene caricata la foto reale -->
  <g opacity="0.30" fill="#C8FF2E" font-family="Helvetica, Arial, sans-serif">
    <rect x="80" y="1462" width="6" height="46" fill="#C8FF2E" opacity="0.7"/>
    <text x="104" y="1482" font-size="21" letter-spacing="2.5">SEGNAPOSTO — sostituire con la foto di Filippo</text>
    <text x="104" y="1506" font-size="17" letter-spacing="1.5" opacity="0.75">assets/img/filippo-hero.jpg</text>
  </g>
</svg>
