# Configurazione Netlify.
# Sito statico puro: nessuna build, si pubblica la radice del repository.
# Averla qui evita di doverla reimpostare a mano nel pannello.

[build]
  publish = "."
  command = ""

# I font hanno nomi stabili e non cambiano mai: si possono tenere in cache
# per un anno. Le immagini un mese, così una foto nuova si propaga prima.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
